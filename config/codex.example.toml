[mcp_servers.fabrica]
command = "uv"
args = ["run", "--project", "/ruta/a/Fabrica-SAP/backend", "fabrica-mcp-fabrica"]
env = { FABRICA_MCP_USER = "consultor", FABRICA_DATABASE_URL = "postgresql+asyncpg://fabrica:fabrica@localhost:5432/fabrica", FABRICA_AUTO_SCHEMA = "false" }

