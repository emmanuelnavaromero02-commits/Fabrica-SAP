stages:
  - key: recepcion
    label: Recepción
    kind: auto
    next: diseno
  - key: diseno
    label: Diseño
    kind: auto
    next: aprobacion_cliente
  - key: aprobacion_cliente
    label: Aprobación del cliente
    kind: gate
    roles: [funcional, usuario_clave]
    next: construccion
    on_reject: diseno
  - key: construccion
    label: Construcción
    kind: auto
    next: revision_abap
  - key: revision_abap
    label: Revisión ABAP
    kind: gate
    roles: [abap]
    next: uat
    on_reject: construccion
  - key: uat
    label: Pruebas de usuario
    kind: gate
    roles: [usuario_clave]
    next: cerrado
    on_reject: construccion
  - key: cerrado
    label: Cerrado
    kind: final
  - key: desestimado
    label: Desestimado
    kind: final

discard_roles: [admin, lider]
