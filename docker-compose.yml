x-app-env: &app-env
  FABRICA_DATABASE_URL: postgresql+asyncpg://fabrica:fabrica@postgres:5432/fabrica
  FABRICA_AUTO_SCHEMA: "false"
  FABRICA_RUNNER: temporal
  FABRICA_TEMPORAL_HOST: temporal:7233
  FABRICA_AUTH_MODE: oidc
  FABRICA_OIDC_ISSUER: http://localhost:8080/realms/fabrica
  FABRICA_OIDC_JWKS_URL: http://keycloak:8080/realms/fabrica/protocol/openid-connect/certs
  FABRICA_PUBLIC_URL: http://localhost:8000
  FABRICA_CORS_ORIGINS: '["http://localhost:8000", "http://localhost:5173"]'

x-app: &app
  build: { context: ., target: app }
  image: fabrica-sap:local
  env_file:
    - path: .env
      required: false
  volumes:
    - fabrica-data:/data
  depends_on:
    postgres: { condition: service_healthy }
    temporal: { condition: service_healthy }
    keycloak: { condition: service_healthy }

x-mcp-env: &mcp-env
  <<: *app-env
  FABRICA_MCP_TRANSPORT: http
  FABRICA_MCP_HOST: 0.0.0.0

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: fabrica
      POSTGRES_DB: fabrica
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica"]
      interval: 3s
      retries: 20
    ports: ["5432:5432"]

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    volumes: [temporal-data:/data]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      retries: 30
    ports: ["7233:7233", "8233:8233"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--hostname", "http://localhost:8080", "--health-enabled", "true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40
    ports: ["8080:8080"]

  api:
    <<: *app
    command: ["sh", "-c", "fabrica-migrate upgrade && fabrica-api"]
    environment:
      <<: *app-env
      FABRICA_KEYCLOAK_URL: http://keycloak:8080
      FABRICA_KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      FABRICA_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["fabrica-worker"]
    environment: *app-env
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  mcp-fabrica:
    <<: *app
    command: ["fabrica-mcp-fabrica"]
    environment:
      <<: *mcp-env
      FABRICA_MCP_PORT: "8101"
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8101:8101"]

  mcp-sap:
    <<: *app
    command: ["fabrica-mcp-sap"]
    environment:
      <<: *mcp-env
      FABRICA_MCP_PORT: "8102"
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8102:8102"]

  mcp-conocimiento:
    <<: *app
    command: ["fabrica-mcp-conocimiento"]
    environment:
      <<: *mcp-env
      FABRICA_MCP_PORT: "8103"
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8103:8103"]

  agente-imagen:
    profiles: ["agente"]
    build: { context: ., dockerfile: backend/Dockerfile.agente }
    image: fabrica-agente:latest

  gitea:
    profiles: ["gitea"]
    image: gitea/gitea:1.26
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
    volumes: [gitea-data:/data]
    ports: ["3000:3000"]

volumes:
  pg-data:
  temporal-data:
  keycloak-data:
  fabrica-data:
  gitea-data:
