# Despliegue LOCAL (Docker Desktop) — Gitea sobre PostgreSQL.
# Sin Caddy: los puertos se publican directamente en 127.0.0.1 (solo loopback).
# OpenProject quedó fuera (la app corre sobre proyecto-db; ver [[op-apagado]]).
# El orquestador/panel/IdP locales viven en sus propios compose (orquestador/, idp/).

name: reqplatform-local

volumes:
  gitea_data:
  gitea_pgdata:

services:
  # ---------------- Gitea ----------------
  gitea-db:
    image: postgres:${POSTGRES_VERSION:-17}
    restart: unless-stopped
    stop_grace_period: "3s"
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: "${GITEA_DB_PASSWORD}"
      POSTGRES_DB: gitea
    volumes:
      - "gitea_pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:${GITEA_TAG:-1.26}
    restart: unless-stopped
    extra_hosts:
      - "kc.fabrica.local:host-gateway"
    environment:
      GITEA__server__DOMAIN: "localhost"
      GITEA__server__SSH_DOMAIN: "localhost"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://localhost:3000/"
      # Puerto anunciado en las URLs de clonado SSH (host 2222 -> contenedor 22).
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "22"
      # Sin asistente de instalacion web y sin auto-registro (criterio de seguridad).
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__database__DB_TYPE: "postgres"
      GITEA__database__HOST: "gitea-db:5432"
      GITEA__database__NAME: "gitea"
      GITEA__database__USER: "gitea"
      GITEA__database__PASSWD: "${GITEA_DB_PASSWORD}"
    volumes:
      - "gitea_data:/data"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    depends_on:
      gitea-db:
        condition: service_healthy
