[project]
name = "fabrica-sap"
version = "0.1.0"
description = "Fábrica de software SAP autónoma — beta mínima"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "openai>=3.19",
    "temporalio>=1.33",
    "mcp>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "defusedxml>=0.7",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-defusedxml"]

[project.scripts]
fabrica-api = "fabrica.api.app:run"
fabrica-worker = "fabrica.workflow.worker:run"
fabrica-mcp-fabrica = "fabrica.mcp_servers.fabrica:run"
fabrica-mcp-sap = "fabrica.mcp_servers.sap:run"
fabrica-migrate = "fabrica.db.migrate:run"
fabrica-mcp-conocimiento = "fabrica.mcp_servers.conocimiento:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
